<!doctype html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/Login.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.rtl.min.css">
    <link rel="icon" href="{{ url_for('static', filename='Elements/icon.png') }}">
    <title>Log In</title>
</head>
<body id="body" style="background-color: #5ce6ff;">
    <div id="container">
        <div class="m-4">
            {% with messages = get_flashed_messages() %}
              {% if messages %}
                <div class="alert alert-danger">
                  {% for message in messages %}
                    <div>{{ message }}</div>
                  {% endfor %}
                </div>
              {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('login') }}">
                <div class="mb-3">
                    <label for="emailInput" class="form-label" style="font-weight: bold;">Email address</label>
                    <input type="text" name="email" class="form-control" id="emailInput" placeholder="E-Mail" required>
                </div>
                <div class="mb-3">
                    <label for="passwordInput" class="form-label" style="font-weight: bold;">Password</label>
                    <input type="password" name="password" class="form-control" id="passwordInput" placeholder="Password" required>
                    <small>Non ci sarà modo di reimpostare le credenziali se dimenticate</small>
                </div>
                <button type="submit" class="btn btn-primary">Accedi</button>
            </form>
        </div>
    </div>
</body>
</html>
