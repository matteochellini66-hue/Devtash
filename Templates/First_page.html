<!DOCTYPE html>
<html lang="it">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="icon" href="{{ url_for('static', filename='Elements/icon.png') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/Style_First_Page.css') }}">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
        <script src="{{url_for('static', filename='js/Script_First_Page.js')}}"></script>
        <title>Benvenuto</title>
    </head>
    <body>
        <!-- Contenitore principale flessibile -->
        <div class="main-container">
            
            <!-- Metà Azzurra -->
            <div id="blue-base" name="blue">
                <div id="blue-item">
                    <h1 id="register-text">Non hai un account?</h1>
                    <button id="Register-button" onclick="register_page()">Registrati</button>
                </div>
                
                <!-- Footer posizionato in basso a sinistra nel blocco blu -->
                <footer class="blue-footer">
                    Marchio Registrato. Tutti i Diritti Riservati. <a href="/policy" target="_blank">Privacy Policy</a>
                </footer>
            </div>
            
            <!-- Metà Rossa/Bianca -->
            <div id="white-base">
                <div id="white-item">
                    <h1 id="login-text">Hai già un account?</h1>
                    <button id="Login-button" onclick="login_page()">Accedi</button>
                </div>
            </div>
            
        </div>
        
    </body>
</html>
