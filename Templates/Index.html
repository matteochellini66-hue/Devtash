<!doctype html>
<html lang="it">
    <head>
    <!-- Required meta tags -->
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <link rel="stylesheet" href="{{url_for('static',filename='css/Style.css')}}">
        <link rel="icon" href="{{ url_for('static', filename='Elements/icon.png') }}">
        <!-- Bootstrap CSS -->
         <script src="{{url_for('static',filename='js/script.js')}}"></script>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.rtl.min.css" integrity="sha384-CfCrinSRH2IR6a4e6fy2q6ioOX7O6Mtm1L9vRvFZ1trBncWmMePhzvafv7oIcWiW" crossorigin="anonymous">

        <title>Devtash</title>
    </head>
    <body style="background-color: #5ce6ff;">

        <nav class="navbar navbar-expand-lg bg-body-tertiary" id="navbar">
            <div class="container-fluid">
                <a class="navbar-brand" href="#"><img src="{{ url_for('static', filename='Elements/icon.png') }}" alt="" id="logo"> Devtash</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav  mb-2 mb-lg-0">
                    <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="/Index">Home</a>
                    </li>
                    <li class="nav-item">
                    <a class="nav-link" href="/create_page" target="_blank">Crea</a>
                    </li>
                    <li class="nav-item">
                    <a class="nav-link" href="/account" target="_blank">
                        Account
                    </a>
                    </li>
                    <li class="nav-item">
                    <a class="nav-link" href="/support" target="_blank">Supportaci</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" style="cursor: pointer;" href="/logout">Logout</a>
                    </li>
                </ul>
                </div>
            </div>
        </nav>
        <H1 id="main-text">Benvenuto {{decryped_name}}</H1>
        <form action="/create_page">
        <button id="crea-btn">+ Crea Nuovo Snippet</button>
        </form>
        {% for snippet in snippets %}
        <div class="snippet-card">
            <div class="snippet-header">
                <span class="snippet-lang">{{ snippet['titolo'] }}</span>
            </div>
  <!-- Header della Card -->
            <div class="snippet-header">
                <span class="snippet-lang">Scritto in {{ snippet['linguaggio'] }}</span>
                
            </div>
            
            <!-- Corpo con il codice -->
            <div class="snippet-body">
                <pre><code>{{ snippet['codice'] }}</code></pre>
                <button class="copy-btn" data-valore="{{ snippet['codice'] }}">Copia</button>
                <form action="/elimina/{{ snippet['id'] }}" method="POST">
                <button id="delete-button">Elimina</button>
                </form>
            </div>
        </div>
        {% endfor %}
        <!-- Bootstrap 5 JS Bundle -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
